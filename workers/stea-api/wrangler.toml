name = "stea-api"
main = "src/index.ts"
compatibility_date = "2024-09-01"

# Route /api/* calls on the live domain (steacode.com) and the legacy
# code.stea.africa host to this Worker. The frontend uses same-origin API_BASE="",
# so steacode.com must own /api/* via a Worker Route for catalog/admin to work.
routes = [
  { pattern = "steacode.com/api/*", zone_name = "steacode.com" },
  { pattern = "code.stea.africa/api/*", zone_name = "stea.africa" }
]

# Cloudflare R2 bucket for STEA Code assets (packages, preview videos, posters)
[[r2_buckets]]
binding = "STEA_BUCKET"
bucket_name = "steacode"

# Cloudflare D1 database for STEA Code data
[[d1_databases]]
binding = "DB"
database_name = "stea-code-db"
database_id = "6184de42-de1b-4ede-9ca3-19bfb16a121c"

# CPU headroom for multipart parsing + streaming uploads.
# NOTE: `cpu_ms` above 10 requires a Workers Paid plan; on Free the deploy is
# rejected (error 100328). Commented out for the Free plan. Re-enable this
# block after upgrading to Workers Paid. Uploads are I/O-bound (R2 streaming),
# so this is insurance, not a requirement.
# [limits]
# cpu_ms = 30000

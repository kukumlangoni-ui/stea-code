<?xml version="1.0" encoding="UTF-8"?>
<!--
  STEA Master Icon — Canonical Source Vector
  ===========================================
  Single source of truth for the Master STEA PWA identity.

  Design: dark obsidian background + gold wireframe globe + gold-bordered
  WWW search bar + gold magnifier with eye detail. Rounded-squircle canvas
  with transparent corners (for purpose:"any" icons).

  All PWA PNG assets (icon-192, icon-512, maskable-192, maskable-512,
  apple-touch-icon, favicon) are generated from this SVG and the maskable
  companion (stea-master-icon-maskable.svg) via
  scripts/generate-stea-pwa-icons.mjs.

  Do not edit this artwork without explicit approval. To change the icon,
  update this SVG, then re-run the generation script.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Deep Obsidian / Space Black Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1017"/>
      <stop offset="50%" stop-color="#07080C"/>
      <stop offset="100%" stop-color="#020305"/>
    </linearGradient>

    <!-- Warm Ambient Core Luminescence -->
    <radialGradient id="ambientGlow" cx="50%" cy="48%" r="58%">
      <stop offset="0%" stop-color="rgba(245, 215, 110, 0.28)"/>
      <stop offset="35%" stop-color="rgba(212, 175, 55, 0.16)"/>
      <stop offset="70%" stop-color="rgba(184, 134, 11, 0.04)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>

    <!-- Outer Bezel Specular Highlight -->
    <linearGradient id="bezelGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.20)"/>
      <stop offset="50%" stop-color="rgba(212, 175, 55, 0.28)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0.5)"/>
    </linearGradient>

    <!-- Luxury Precision Gold Gradient -->
    <linearGradient id="goldLuxury" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FFF5C2"/>
      <stop offset="25%" stop-color="#F5D76E"/>
      <stop offset="55%" stop-color="#D4AF37"/>
      <stop offset="85%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#8F6306"/>
    </linearGradient>

    <!-- Lens Glass Radial Depth -->
    <radialGradient id="lensGlass" cx="38%" cy="36%" r="65%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.38)"/>
      <stop offset="45%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(10, 11, 16, 0.88)"/>
    </radialGradient>

    <!-- Dimensional Drop Shadow -->
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="rgba(0,0,0,0.65)"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(212,175,55,0.25)"/>
    </filter>
  </defs>

  <!-- Solid Apple-Style Rounded Squircle Canvas -->
  <rect width="1024" height="1024" rx="228" fill="url(#bgGrad)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#ambientGlow)"/>
  <rect width="1024" height="1024" rx="228" fill="none" stroke="url(#bezelGrad)" stroke-width="4"/>

  <!-- Centered Scaled Master World Discovery Mark (Safely positioned within 80% safe-zone) -->
  <g transform="translate(142, 142)" filter="url(#markShadow)">
    <svg width="740" height="740" viewBox="0 0 200 200" fill="none">
      <!-- Outer planetary ring -->
      <circle cx="100" cy="100" r="90" stroke="url(#goldLuxury)" stroke-width="4.5"/>
      <circle cx="100" cy="100" r="87" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>

      <!-- Longitudinal Meridians -->
      <ellipse cx="100" cy="100" rx="58" ry="90" stroke="url(#goldLuxury)" stroke-width="2.8" opacity="0.92"/>
      <ellipse cx="100" cy="100" rx="28" ry="90" stroke="url(#goldLuxury)" stroke-width="2.5" opacity="0.88"/>

      <!-- Equator -->
      <line x1="10" y1="100" x2="190" y2="100" stroke="url(#goldLuxury)" stroke-width="2.8"/>

      <!-- Latitudes -->
      <path d="M 32 60 Q 100 50 168 60" stroke="url(#goldLuxury)" stroke-width="2.5" opacity="0.88"/>
      <path d="M 32 140 Q 100 150 168 140" stroke="url(#goldLuxury)" stroke-width="2.5" opacity="0.88"/>
      <path d="M 22 80 Q 100 72 178 80" stroke="url(#goldLuxury)" stroke-width="2" opacity="0.75"/>
      <path d="M 22 120 Q 100 128 178 120" stroke="url(#goldLuxury)" stroke-width="2" opacity="0.75"/>

      <!-- Discovery Hub / Global WWW Pill -->
      <rect x="26" y="88" width="114" height="24" rx="12" fill="#0A0B10" stroke="url(#goldLuxury)" stroke-width="2.2"/>
      <rect x="28" y="90" width="110" height="20" rx="10" fill="rgba(245,215,110,0.08)"/>
      <text x="83" y="105.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="13.5" font-weight="900" fill="#FFFFFF" letter-spacing="1.8">WWW</text>

      <!-- Discovery Lens / Focal Aperture Portal -->
      <circle cx="146" cy="100" r="18" fill="#0A0B10" stroke="url(#goldLuxury)" stroke-width="3.2"/>
      <circle cx="146" cy="100" r="14.5" fill="url(#lensGlass)"/>
      <circle cx="146" cy="100" r="10" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity="0.95"/>
      <circle cx="142" cy="95" r="2.8" fill="#FFFFFF" opacity="0.95"/>
      <line x1="159" y1="113" x2="175" y2="129" stroke="url(#goldLuxury)" stroke-width="5" stroke-linecap="round"/>
      <line x1="159" y1="113" x2="175" y2="129" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </g>
</svg>
